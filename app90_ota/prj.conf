CONFIG_GPIO=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_DEFAULT_LEVEL=3

CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# UART interrupt-driven API
CONFIG_UART_INTERRUPT_DRIVEN=y

# System tick
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

# Flash support (QSPI NOR)
CONFIG_FLASH=y
CONFIG_FLASH_STM32_QSPI=y

# CRC32
CONFIG_CRC=y

# Reboot
CONFIG_REBOOT=y
