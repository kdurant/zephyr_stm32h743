[package]
name = "ota-pc-tool"
version = "0.1.0"
description = "OTA firmware upgrade tool for STM32H743"
authors = ["wj"]
edition = "2021"

[lib]
name = "ota_pc_tool_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"
tokio = { version = "1", features = ["rt", "sync", "macros", "time", "io-util"] }
crc32fast = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
