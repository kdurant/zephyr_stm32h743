# MCUboot 子镜像额外配置 —— 通过 sysbuild 自动加载

# 启用 UART 控制台输出（MCUboot 默认不启用）
CONFIG_UART_CONSOLE=y

# 日志通过 printk 路由到 UART 控制台
CONFIG_LOG_PRINTK=y

# STM32 内存映射模式，MCUboot 需要从内部 Flash 直接执行
CONFIG_STM32_MEMMAP=y

# 禁用自动计算扇区数（CMake 整数除法会导致截断）
# 手动设置足够覆盖 slot0(896KB) + slot1(896KB) 的扇区数
# STM32H743 擦除块 = 128KB，896/128 = 7，因此至少需要 7
CONFIG_BOOT_MAX_IMG_SECTORS_AUTO=n
CONFIG_BOOT_MAX_IMG_SECTORS=128

# 使用 swap-move 模式（无需 scratch 分区）
# 通过 RAM 缓冲区实现 slot0 和 slot1 的固件交换
CONFIG_BOOT_SWAP_USING_MOVE=y
