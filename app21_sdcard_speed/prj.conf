CONFIG_GPIO=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_UART_CONSOLE=y
CONFIG_MAIN_STACK_SIZE=4096

# I2C support
CONFIG_I2C=y
CONFIG_I2C_STM32=y

# SD Card and File System support
CONFIG_DISK_ACCESS=y
CONFIG_SDMMC_STM32=y
CONFIG_SDMMC_STM32_HWFC=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FILE_SYSTEM=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_MAX_LFN=255

# STM32H743: disable D-cache to avoid DMA coherency issues with SDMMC
CONFIG_DCACHE=n

# Heap for large test buffer
CONFIG_HEAP_MEM_POOL_SIZE=131072

# Sys clock for uptime measurement
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000
